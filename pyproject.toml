[tool.uv.workspace]
members = ["src/shared", "src/ingest", "src/management"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9",
    "pytest-django>=4.14.0",
]

[tool.ruff]
extend-exclude = ["private"]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "F", "I", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "ingest", "management"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["src/shared", "src/ingest", "src/management"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "management.config.settings"

[tool.pyright]
include = ["src/shared", "src/ingest", "src/management"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
